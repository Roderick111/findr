name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Clippy + Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build findr-ocr
        if: runner.os == 'macOS'
        run: cd findr-ocr && swift build -c release

      - name: Build Raycast extension
        if: runner.os == 'macOS'
        working-directory: raycast-extension
        run: |
          npm install
          npx ray build

  release:
    name: Build & Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain with targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/findr \
            target/x86_64-apple-darwin/release/findr \
            -output findr-macos-universal

      - name: Prepare release assets
        run: |
          cp target/aarch64-apple-darwin/release/findr findr-macos-arm64
          cp target/x86_64-apple-darwin/release/findr findr-macos-x86_64
          chmod +x findr-macos-universal findr-macos-arm64 findr-macos-x86_64
          codesign --force --sign - findr-macos-universal
          codesign --force --sign - findr-macos-arm64
          codesign --force --sign - findr-macos-x86_64

      - name: Build findr-ocr (arm64)
        run: cd findr-ocr && swift build -c release --arch arm64

      - name: Build findr-ocr (x86_64)
        run: cd findr-ocr && swift build -c release --arch x86_64

      - name: Create findr-ocr universal binary
        run: |
          lipo -create \
            findr-ocr/.build/arm64-apple-macosx/release/findr-ocr \
            findr-ocr/.build/x86_64-apple-macosx/release/findr-ocr \
            -output findr-ocr-macos-universal
          chmod +x findr-ocr-macos-universal
          codesign --force --sign - findr-ocr-macos-universal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            findr-macos-universal
            findr-macos-arm64
            findr-macos-x86_64
            findr-ocr-macos-universal
