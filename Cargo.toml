[package]
name = "findr"
version = "1.3.0"
description = "The fastest local file search. Finds what your OS search can't."
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
nucleo = "0.5"
ignore = "0.4"
chrono = "0.4"
anyhow = "1"
tantivy = "0.22"
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1.10"
reverse_geocoder = "4"
ureq = { version = "2", features = ["json"] }
hnsw_rs = "0.3.4"
fs4 = "0.12"
directories = "5"

[target.'cfg(target_os = "macos")'.dependencies]
fsevent-sys = "5.2"
core-foundation = "0.10"

[target.'cfg(not(target_os = "macos"))'.dependencies]
ocrs = "0.12"
rten = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
proptest = "1"
assert_cmd = "2"
predicates = "3"

# Fast iteration profile: near-release perf, ~15s builds instead of ~2min
# Usage: cargo build --profile dev-release
[profile.dev-release]
inherits = "release"
lto = false

# Full release: deploy only (make deploy)
[profile.release]
opt-level = 3
lto = true
strip = true
